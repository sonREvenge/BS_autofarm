[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "revenge-bs-industry"
version = "0.2.0"
description = "Local Brawl Stars automation over ADB"
requires-python = ">=3.11"
license-files = ["licenses/*.txt", "THIRD_PARTY.md"]
dependencies = [
  "numpy>=1.26,<3", "opencv-python-headless>=4.10,<6",
  "adbutils>=2.12,<3", "av>=14,<19",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.20,<2"]
cuda = ["onnxruntime-gpu>=1.20,<2"]
directml = ["onnxruntime-directml>=1.20,<2; sys_platform == 'win32'"]
discord = ["discord.py>=2.5,<3"]
dev = ["ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
revenge = "revenge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revenge = ["assets/**/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
